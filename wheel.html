<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>转盘抽奖</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="mx-auto flex min-h-screen max-w-4xl items-center justify-center p-4">
      <section class="w-full rounded-2xl border border-slate-200 bg-white p-4 md:p-6">
        <div class="mb-3 flex items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">转盘抽奖</h1>
            <p class="mt-1 text-sm text-slate-500" id="titleTips">点击开始抽奖</p>
          </div>
          <button id="backBtn" class="rounded-md border border-slate-300 px-3 py-2 text-sm" type="button">返回配置页</button>
        </div>

        <div id="employeeForm" class="mb-2 hidden grid gap-2 md:grid-cols-3">
          <input id="empId" class="h-10 rounded-md border border-slate-300 px-3 text-sm" placeholder="员工工号" />
          <input id="empName" class="h-10 rounded-md border border-slate-300 px-3 text-sm" placeholder="员工姓名" />
          <button id="verifyBtn" class="h-10 rounded-md border border-slate-300 text-sm" type="button">确认身份</button>
        </div>
        <p id="empStatus" class="min-h-[20px] text-sm text-slate-500"></p>

        <div class="mt-2 flex justify-center">
          <div class="h-0 w-0 border-l-[14px] border-r-[14px] border-t-[24px] border-l-transparent border-r-transparent border-t-slate-800"></div>
        </div>

        <div class="mt-2 flex justify-center">
          <canvas id="wheel" width="460" height="460" class="w-full max-w-[390px] rounded-full border-8 border-slate-300 bg-white"></canvas>
        </div>

        <p id="result" class="mt-3 min-h-[24px] text-center text-base font-semibold text-emerald-600">等待抽奖</p>

        <div class="mt-3 flex flex-wrap justify-center gap-2">
          <button id="spinBtn" class="rounded-md bg-slate-800 px-4 py-2 text-sm text-white" type="button">开始抽奖</button>
        </div>

        <p id="remain" class="mt-3 text-center text-sm text-slate-500"></p>
      </section>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const encoded = params.get("c");

      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const resultEl = document.getElementById("result");
      const remainEl = document.getElementById("remain");
      const spinBtn = document.getElementById("spinBtn");
      const empForm = document.getElementById("employeeForm");
      const empStatus = document.getElementById("empStatus");
      const empId = document.getElementById("empId");
      const empName = document.getElementById("empName");
      const verifyBtn = document.getElementById("verifyBtn");

      let config = null;
      let stock = [];
      let drawn = [];
      let currentEmployee = null;
      let spinning = false;
      let rotation = 0;

      function toBase64Url(str) {
        return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function fromBase64Url(str) {
        const b64 = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
        return decodeURIComponent(escape(atob(b64)));
      }

      function fp(c) {
        return toBase64Url(JSON.stringify({ prizes: c.prizes, employees: c.employees || [], eventName: c.eventName }));
      }

      function normAngle(a) {
        const t = Math.PI * 2;
        return ((a % t) + t) % t;
      }

      function prizeLabel(prize, idx) {
        const tier = String(prize.tier || `${idx + 1}等奖`).trim();
        const name = String(prize.name || "").trim();
        return name || tier;
      }

      function stockKey() { return `lottery_stock_${fp(config)}`; }
      function drawnKey() { return `lottery_drawn_${fp(config)}`; }
      function logsKey() { return `lottery_wheel_logs_${fp(config)}`; }

      function palette(theme) {
        if (theme === "cyber") return ["#00d0ff", "#74ff70", "#1ea5ff", "#53ffd8", "#63e5ff", "#9eff86"];
        if (theme === "gala") return ["#d7b56f", "#cba15a", "#f2dcab", "#b6914c", "#e3c683", "#9c7739"];
        return ["#ffe097", "#ffc07d", "#ffd7bc", "#ffeac4", "#ffd08f", "#f7b88f"];
      }

      function setTheme(theme) {
        const t = ["festive", "cyber", "gala"].includes(theme) ? theme : "festive";
        document.body.classList.remove("bg-slate-50", "bg-slate-900", "bg-zinc-900", "text-slate-900", "text-slate-100");
        if (t === "cyber") {
          document.body.classList.add("bg-slate-900", "text-slate-100");
        } else if (t === "gala") {
          document.body.classList.add("bg-zinc-900", "text-slate-100");
        } else {
          document.body.classList.add("bg-slate-50", "text-slate-900");
        }
      }

      function drawWheel(angle = 0) {
        const p = config.prizes;
        const colors = palette(config.theme);
        const center = canvas.width / 2;
        const radius = center - 8;
        const seg = (Math.PI * 2) / p.length;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(angle);

        p.forEach((x, i) => {
          const s = i * seg;
          const e = s + seg;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, s, e);
          ctx.closePath();
          ctx.fillStyle = colors[i % colors.length];
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.rotate(s + seg / 2);
          ctx.translate(radius * 0.62, 0);
          ctx.rotate(Math.PI / 2);
          ctx.fillStyle = config.theme === "cyber" ? "#06162c" : "#2e1e0f";
          ctx.font = "bold 18px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(prizeLabel(x, i).slice(0, 8), 0, 0);
          ctx.restore();
        });

        ctx.restore();
      }

      function chooseIndex() {
        const mode = config.probMode || "dynamic_weight";
        const pool = [];
        config.prizes.forEach((x, i) => {
          const w = mode === "percent_100" ? Math.max(0, Number(x.percent) || 0) : Math.max(0, Number(x.weight) || 0);
          if (stock[i] > 0 && w > 0) pool.push({ i, w });
        });
        if (!pool.length) return -1;
        const total = pool.reduce((s, x) => s + x.w, 0);
        let r = Math.random() * total;
        for (const item of pool) {
          r -= item.w;
          if (r <= 0) return item.i;
        }
        return pool[pool.length - 1].i;
      }

      function saveState() {
        localStorage.setItem(stockKey(), JSON.stringify(stock));
        localStorage.setItem(drawnKey(), JSON.stringify(drawn));
      }

      function pushLog(prize) {
        const logs = JSON.parse(localStorage.getItem(logsKey()) || "[]");
        logs.push({
          time: new Date().toLocaleString(),
          employeeId: currentEmployee ? currentEmployee.id : "",
          employeeName: currentEmployee ? currentEmployee.name : "",
          prize
        });
        localStorage.setItem(logsKey(), JSON.stringify(logs));
      }

      function refreshRemain() {
        const lines = config.prizes.map((x, i) => `${prizeLabel(x, i)}:${stock[i]}`);
        if ((config.employees || []).length) lines.push(`已中奖员工 ${drawn.length}/${config.employees.length}`);
        remainEl.textContent = lines.join(" | ");
      }

      function setEmpStatus(msg, type = "") {
        empStatus.textContent = msg;
        empStatus.className = `min-h-[20px] text-sm ${type === "err" ? "text-rose-600" : type === "ok" ? "text-emerald-600" : "text-slate-500"}`;
      }

      function verifyEmployee() {
        const list = config.employees || [];
        if (!list.length) {
          currentEmployee = null;
          spinBtn.disabled = false;
          return;
        }

        const id = String(empId.value || "").trim();
        const name = String(empName.value || "").trim();
        if (!id || !name) {
          currentEmployee = null;
          spinBtn.disabled = true;
          return setEmpStatus("请填写工号和姓名", "err");
        }

        const found = list.find((x) => x.id === id && x.name === name);
        if (!found) {
          currentEmployee = null;
          spinBtn.disabled = true;
          return setEmpStatus("员工信息不匹配", "err");
        }
        if (drawn.includes(found.id)) {
          currentEmployee = null;
          spinBtn.disabled = true;
          return setEmpStatus("该员工已中奖，不可重复", "err");
        }

        currentEmployee = found;
        spinBtn.disabled = false;
        setEmpStatus(`已确认：${found.id} ${found.name}`, "ok");
      }

      function spin() {
        if (spinning) return;
        if ((config.employees || []).length && !currentEmployee) {
          spinBtn.disabled = true;
          return setEmpStatus("请先确认员工身份", "err");
        }

        const idx = chooseIndex();
        if (idx < 0) {
          resultEl.textContent = "奖品已抽完";
          return;
        }

        spinning = true;
        resultEl.textContent = "抽奖中...";

        const seg = (Math.PI * 2) / config.prizes.length;
        const pointer = Math.PI * 1.5;
        const targetCenter = idx * seg + seg / 2;
        const targetRotation = normAngle(pointer - targetCenter);
        const curNorm = normAngle(rotation);
        let delta = targetRotation - curNorm;
        if (delta < 0) delta += Math.PI * 2;
        const end = rotation + Math.PI * 2 * 7 + delta;

        const start = performance.now();
        const dur = 3600;

        function animate(now) {
          const t = Math.min(1, (now - start) / dur);
          const eased = 1 - Math.pow(1 - t, 3);
          drawWheel(rotation + (end - rotation) * eased);
          if (t < 1) return requestAnimationFrame(animate);

          rotation = targetRotation;
          drawWheel(rotation);

          stock[idx] -= 1;
          if (currentEmployee) drawn.push(currentEmployee.id);
          saveState();

          const prize = prizeLabel(config.prizes[idx], idx);
          pushLog(prize);
          refreshRemain();
          resultEl.textContent = currentEmployee ? `${currentEmployee.name} 抽中：${prize}` : `抽中：${prize}`;

          if (currentEmployee) {
            currentEmployee = null;
            empId.value = "";
            empName.value = "";
            spinBtn.disabled = true;
            setEmpStatus("请下一位确认身份", "");
          }

          spinning = false;
        }

        requestAnimationFrame(animate);
      }

      function init() {
        if (!encoded) {
          alert("缺少配置参数，返回配置页重新生成链接");
          location.href = "index.html";
          return;
        }

        try {
          config = JSON.parse(fromBase64Url(encoded));
        } catch (e) {
          alert("链接配置解析失败");
          location.href = "index.html";
          return;
        }

        if (!config || !Array.isArray(config.prizes) || !config.prizes.length) {
          alert("配置无效");
          location.href = "index.html";
          return;
        }

        config.prizes = config.prizes
          .map((x, i) => ({
            tier: String(x.tier || `${i + 1}等奖`).trim(),
            name: String(x.name || "").trim(),
            qty: Math.max(0, Number(x.qty) || 0),
            weight: Math.max(0, Number(x.weight) || 0),
            percent: Math.max(0, Number(x.percent) || 0),
            drawMode: x.drawMode === "total_and_rounds" ? "total_and_rounds" : "fixed_per_round",
            rounds: Math.max(1, Number(x.rounds) || 1),
            perRound: Math.max(1, Number(x.perRound) || 1),
            totalPeople: Math.max(0, Number(x.totalPeople) || 0)
          }))
          .filter((x) => x.qty > 0);

        config.employees = Array.isArray(config.employees)
          ? config.employees.map((x) => ({ id: String(x.id || "").trim(), name: String(x.name || "").trim() })).filter((x) => x.id && x.name)
          : [];

        config.theme = params.get("t") || config.theme || "festive";
        config.probMode = config.probMode || "dynamic_weight";
        if (config.probMode === "percent_100") {
          const sum = config.prizes.reduce((s, x) => s + x.percent, 0);
          if (Math.abs(sum - 100) > 0.0001) {
            alert(`百分比配置无效，总和应为100，当前为 ${sum}`);
            location.href = "index.html";
            return;
          }
        }

        setTheme(config.theme);

        const localStock = JSON.parse(localStorage.getItem(stockKey()) || "null");
        stock = Array.isArray(localStock) && localStock.length === config.prizes.length
          ? localStock.map((x) => Math.max(0, Number(x) || 0))
          : config.prizes.map((x) => x.qty);

        const localDrawn = JSON.parse(localStorage.getItem(drawnKey()) || "[]");
        drawn = Array.isArray(localDrawn) ? localDrawn.map((x) => String(x)) : [];
        saveState();

        if (config.employees.length) {
          empForm.classList.remove("hidden");
          spinBtn.disabled = true;
          setEmpStatus("请先确认员工身份", "");
        }

        drawWheel(0);
        refreshRemain();

        verifyBtn.addEventListener("click", verifyEmployee);
        empId.addEventListener("keydown", (e) => e.key === "Enter" && verifyEmployee());
        empName.addEventListener("keydown", (e) => e.key === "Enter" && verifyEmployee());
        spinBtn.addEventListener("click", spin);
        document.getElementById("backBtn").addEventListener("click", () => location.href = "index.html");
      }

      init();
    </script>
  </body>
</html>
